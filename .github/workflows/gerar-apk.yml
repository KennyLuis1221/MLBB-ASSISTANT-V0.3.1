name: Gerar APK MLBB Assistant

on:
  workflow_dispatch:
  push:
    paths:
      - 'MLBB_ASSISTANT_CODIGO_GITHUB.zip'
      - '.github/workflows/gerar-apk.yml'

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Baixar arquivos do repositório
        uses: actions/checkout@v4

      - name: Extrair projeto Android do ZIP
        shell: bash
        run: |
          test -f MLBB_ASSISTANT_CODIGO_GITHUB.zip
          unzip -q MLBB_ASSISTANT_CODIGO_GITHUB.zip
          test -f android-app/app/build.gradle.kts

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # O runner ubuntu-latest já disponibiliza o Android SDK.
      # Evita android-actions/setup-android@v3, que tenta baixar o pacote removido "tools".
      - name: Verificar Android SDK do GitHub
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME"
          if command -v sdkmanager >/dev/null 2>&1; then
            sdkmanager --version
          else
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version
          fi

      - name: Instalar plataforma Android 35
        shell: bash
        run: |
          if command -v sdkmanager >/dev/null 2>&1; then
            SDKMANAGER="$(command -v sdkmanager)"
          else
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK de teste
        working-directory: android-app
        run: gradle --no-daemon :app:assembleDebug

      - name: Disponibilizar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: MLBB-ASSISTANT-APK
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
