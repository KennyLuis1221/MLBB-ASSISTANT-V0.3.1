name: Gerar APK MLBB Assistant

on:
  workflow_dispatch:
  push:
    paths:
      - 'MLBB_ASSISTANT_CODIGO_GITHUB.zip'
      - '.github/workflows/gerar-apk.yml'
      - 'updates/v0_4/**'

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Baixar arquivos do repositório
        uses: actions/checkout@v4

      - name: Extrair projeto Android do ZIP
        shell: bash
        run: |
          test -f MLBB_ASSISTANT_CODIGO_GITHUB.zip
          unzip -q MLBB_ASSISTANT_CODIGO_GITHUB.zip
          test -f android-app/app/build.gradle.kts

      - name: Aplicar V0.4 e validar catalogo
        shell: bash
        run: |
          cp updates/v0_4/MainActivity.kt android-app/app/src/main/java/com/mlbb/assistant/MainActivity.kt
          cp updates/v0_4/HeroCatalog.kt android-app/app/src/main/java/com/mlbb/assistant/HeroCatalog.kt
          cp updates/v0_4/multihero_engine.py server/multihero_engine.py
          cp updates/v0_4/test_multihero.py server/test_multihero.py
          python3 updates/v0_4/export_heroes.py
          python3 updates/v0_4/patch_server.py
          python3 -m py_compile server/app.py server/multihero_engine.py server/vision_bridge.py
          PYTHONPATH=server python3 - <<'PY'
          from multihero_engine import CATALOG, recommend_multi, suggest_draft
          assert len(CATALOG) >= 120, len(CATALOG)
          assert recommend_multi("Layla", [], True, False, False)["recommendations"][0]["item"] == "Malefic Roar"
          assert recommend_multi("Kagura", [], False, False, False)["recommendations"]
          assert len(suggest_draft("Ouro", [], [], ["Beatrix", "Brody"])) == 3
          print("Validado:", len(CATALOG), "herois")
          PY
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android-app/app/build.gradle.kts")
          s = p.read_text(encoding="utf-8").replace('versionCode = 4', 'versionCode = 5').replace('versionName = "0.3.1"', 'versionName = "0.4.0"')
          p.write_text(s, encoding="utf-8")
          PY

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # O runner ubuntu-latest já disponibiliza o Android SDK.
      # Evita android-actions/setup-android@v3, que tenta baixar o pacote removido "tools".
      - name: Verificar Android SDK do GitHub
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME"
          if command -v sdkmanager >/dev/null 2>&1; then
            sdkmanager --version
          else
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version
          fi

      - name: Instalar plataforma Android 35
        shell: bash
        run: |
          if command -v sdkmanager >/dev/null 2>&1; then
            SDKMANAGER="$(command -v sdkmanager)"
          else
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK de teste
        working-directory: android-app
        run: gradle --no-daemon :app:assembleDebug

      - name: Disponibilizar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: MLBB-ASSISTANT-APK
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Empacotar fontes atualizadas
        shell: bash
        run: |
          cp updates/v0_4/README.md README_V0_4.md
          zip -q -r MLBB_ASSISTANT_V0_4_SOURCE.zip android-app server README_V0_4.md

      - name: Disponibilizar codigo-fonte atualizado
        uses: actions/upload-artifact@v4
        with:
          name: MLBB-ASSISTANT-V0.4-FONTES
          path: MLBB_ASSISTANT_V0_4_SOURCE.zip
          if-no-files-found: error
