name: Limpar tentativas com erro V0.5

on:
  push:
    paths:
      - '.github/workflows/limpar-v05.yml'
permissions:
  actions: write
  contents: read

jobs:
  limpar:
    runs-on: ubuntu-latest
    steps:
      - name: Apagar somente duas tentativas anteriores que falharam
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo="${{ github.repository }}"
          for id in 45183081398 45183125278; do
            result="$(gh api "repos/$repo/actions/runs/$id" --jq .conclusion)"
            if [ "$result" = "failure" ]; then
              gh api -X DELETE "repos/$repo/actions/runs/$id"
              echo "Falha removida: $id"
            else
              echo "Não alterado: $id, conclusão $result"
            fi
          done
